<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOR Hub login</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh}
  form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;width:min(360px,100% - 32px)}
  input{width:100%;margin:12px 0}
</style>
</head>
<body>
<form onsubmit="location.href='/?token='+encodeURIComponent(this.t.value);return false">
  <b>YOR Hub</b>
  <p class="muted">Token is in <code>~/.config/yor_hub/token</code> on the robot.</p>
  <input name="t" type="password" placeholder="token" autofocus>
  <button type="submit">Log in</button>
</form>
</body>
</html>
